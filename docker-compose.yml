version: '3.8'

services:
  neurosim:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neurosim-web
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "5005:5005/udp"
    environment:
      - PORT=8000
    volumes:
      - neurosim-db:/app/db
      - neurosim-logs:/app/logs
      - neurosim-reports:/app/reports

volumes:
  neurosim-db:
  neurosim-logs:
  neurosim-reports:
