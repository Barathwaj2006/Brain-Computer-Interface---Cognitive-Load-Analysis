name: Build Windows Executable (NeuroSim.exe)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Run Medical System Diagnostics Verification
      run: |
        python scripts/verify_medical.py

    - name: Build Standalone Executable (NeuroSim.exe)
      run: |
        pyinstaller --noconfirm --clean NeuroSim.spec

    - name: Upload NeuroSim.exe Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NeuroSim-Windows-Executable
        path: dist/NeuroSim.exe
